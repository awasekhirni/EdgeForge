[package]
name = "edgeforge-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EdgeForge desktop application shell — Tauri 2 + React UI"

[lib]
name = "edgeforge_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
edgeforge-core.workspace = true
edgeforge-observability.workspace = true
edgeforge-orchestration.workspace = true
edgeforge-api.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

# HTTP client for IPC handlers (talks to the API server).
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Tauri — only pulled in when the tauri-shell feature is on (requires system
# webview libs: webkit2gtk on Linux, WebView2 on Windows, WKWebView on macOS).
tauri = { version = "2.0", optional = true }
tauri-plugin-shell = { version = "2.0", optional = true }

[features]
default = []
# Enable the real Tauri 2 desktop shell. Requires:
#   - Linux: webkit2gtk-4.1-dev, libgtk-3-dev, libappindicator3-dev
#   - macOS: Xcode + Command Line Tools
#   - Windows: WebView2 (preinstalled on Win10/11)
# When this feature is OFF, run() starts in headless mode (no window, just
# the IPC + API-server logic) — suitable for CI, servers, and dev.
tauri-shell = ["dep:tauri", "dep:tauri-plugin-shell"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3.13"
