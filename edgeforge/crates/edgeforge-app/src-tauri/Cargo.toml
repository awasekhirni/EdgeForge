[package]
name = "edgeforge-desktop"
version = "0.1.0"
description = "EdgeForge desktop application (Tauri shell)"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"

[[bin]]
name = "edgeforge-desktop"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
edgeforge-app = { path = "..", features = ["tauri-shell"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# This crate is the Tauri binary — it always enables the tauri-shell feature
# on edgeforge-app.
default = []
