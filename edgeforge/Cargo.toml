[workspace]
resolver = "2"
members = [
    "crates/edgeforge-core",
    "crates/edgeforge-core-legacy",
    "crates/edgeforge-observability",
    "crates/edgeforge-security",
    "crates/edgeforge-promptsec",
    "crates/edgeforge-storage",
    "crates/edgeforge-graph",
    "crates/edgeforge-runtime",
    "crates/edgeforge-runtime-sys",
    "crates/edgeforge-net",
    "crates/edgeforge-crowd",
    "crates/edgeforge-orchestration",
    "crates/edgeforge-autonomic",
    "crates/edgeforge-kpi",
    "crates/edgeforge-perf",
    "crates/edgeforge-api",
    "crates/edgeforge-sdk-python",
    "crates/edgeforge-cli",
    "crates/edgeforge-app",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = { version = "1.1", features = ["serde"] }
figment = { version = "0.10", features = ["toml", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
io-uring = "0.6"
libc = "0.2"
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rustls = "0.23"
rcgen = "0.13"
zeroize = "1.8"
base64 = "0.22"
hex = "0.4"
quinn = "0.11"
zeroconf = "0.14"
rustls-pemfile = "2.1"
dashmap = "6.1"
parking_lot = "0.12"
crossbeam = "0.8"
crossbeam-queue = "0.3"
ahash = "0.8"
smallvec = "1.13"
regex = "1.11"
once_cell = "1.20"
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
governor = "0.6"
bytes = "1.7"
http = "1.1"
toml = "0.8"
tokio-stream = "0.1"
ipnet = "2.10"
tempfile = "3.13"
cc = "1.0"
cmake = "0.1"
bindgen = "0.70"
clap = { version = "4.5", features = ["derive", "env"] }
tauri = "2.0"
pyo3 = { version = "0.22", features = ["extension-module"] }
edgeforge-core = { path = "crates/edgeforge-core" }
edgeforge-core-legacy = { path = "crates/edgeforge-core-legacy" }
edgeforge-observability = { path = "crates/edgeforge-observability" }
edgeforge-security = { path = "crates/edgeforge-security" }
edgeforge-promptsec = { path = "crates/edgeforge-promptsec" }
edgeforge-storage = { path = "crates/edgeforge-storage" }
edgeforge-graph = { path = "crates/edgeforge-graph" }
edgeforge-runtime = { path = "crates/edgeforge-runtime" }
edgeforge-runtime-sys = { path = "crates/edgeforge-runtime-sys" }
edgeforge-net = { path = "crates/edgeforge-net" }
edgeforge-crowd = { path = "crates/edgeforge-crowd" }
edgeforge-orchestration = { path = "crates/edgeforge-orchestration" }
edgeforge-autonomic = { path = "crates/edgeforge-autonomic" }
edgeforge-kpi = { path = "crates/edgeforge-kpi" }
edgeforge-perf = { path = "crates/edgeforge-perf" }
edgeforge-api = { path = "crates/edgeforge-api" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev]
debug = "line-tables-only"
